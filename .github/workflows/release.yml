# Automatic versioning + signed releases with semantic-release (config: .releaserc.json).
#
# Every push to main: semantic-release reads the Conventional Commits since the last tag.
#   fix: → patch, feat: → minor, feat!: / BREAKING CHANGE → major, others → no release.
# If a release is due it (1) builds, signs and verifies the APK with that version
# (scripts/ci/release-build.sh — a failure stops everything before any tag exists), then
# (2) tags vX.Y.Z and publishes the GitHub Release: release notes generated from the commits
# (the changelog lives on the tag/release) + APK, SHA256SUMS, R8 mapping, native symbols.
# Nothing is committed back to the repository.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of ~/airplayrx-keys/airplayrx-release.jks
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         airplayrx
#   ANDROID_KEY_PASSWORD      key password (same as the keystore password for PKCS12 keystores)
# Required repository variable: RELEASE_CERT_SHA256 (certificate fingerprint; without it the job
# is skipped, so forks don't try to release).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Releases never run in parallel and are never cancelled half-way.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Release tooling, installed on the fly with npx (no package.json/lockfile in the repo).
  # Exact versions keep releases reproducible; bump them here to upgrade. The preset's major
  # must match the conventional-changelog-writer bundled with semantic-release: 25.x ships
  # release-notes-generator 14 (writer 8) → preset 9.x. Preset 10 needs writer 9 and fails
  # in generateNotes ("Missing helper").
  NODE_VERSION: "24.22.1"
  SEMANTIC_RELEASE_PACKAGES: >-
    semantic-release@25.0.9
    @semantic-release/exec@7.1.0
    conventional-changelog-conventionalcommits@9.3.1
  # Public SHA-256 fingerprint of the release certificate (repository variable, see CONTRIBUTING.md):
  # release-build.sh refuses an APK signed with anything else.
  EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}

jobs:
  release:
    name: semantic-release
    # Only where releases are configured (the variable is set): forks and clones without signing
    # secrets simply skip releasing instead of failing.
    if: vars.RELEASE_CERT_SHA256 != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write   # create the tag and the GitHub Release (no commits)
    steps:
      - name: Check out (full history + tags for commit analysis)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # No stored credentials; semantic-release pushes only the tag, with GITHUB_TOKEN.
          persist-credentials: false

      - name: Set up Node.js (release tooling)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Install pinned Android SDK packages (versions from app/build.gradle.kts)
        run: scripts/setup-sdk.sh --ci

      - name: Cache third-party sources and OpenSSL build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party
          key: third-party-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-${{ hashFiles('scripts/fetch-deps.sh', 'scripts/build-openssl.sh', 'gradle.properties') }}

      - name: Fetch pinned dependencies and build OpenSSL
        run: |
          scripts/fetch-deps.sh
          OPENSSL_JOBS="$(nproc)" scripts/build-openssl.sh

      - name: Tests (a release must pass them)
        run: |
          scripts/test-native.sh
          ./gradlew --no-daemon testDebugUnitTest

      # Secrets go through env (never interpolated into the script) and only into the runner's
      # temp dir, which the always-run cleanup step deletes.
      - name: Prepare signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "ANDROID_KEYSTORE_BASE64 secret missing"; exit 1; }
          dir="$RUNNER_TEMP/signing"; mkdir -p "$dir"; chmod 700 "$dir"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$dir/release.jks"
          {
            echo "storeFile=$dir/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$dir/signing.properties"
          chmod 600 "$dir/release.jks" "$dir/signing.properties"
          echo "AIRPLAYRX_SIGNING=$dir/signing.properties" >> "$GITHUB_ENV"

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # npm must not run install scripts of the downloaded packages.
          npm_config_ignore_scripts: "true"
        run: |
          pkgs=()
          for p in $SEMANTIC_RELEASE_PACKAGES; do pkgs+=(--package "$p"); done
          npx --yes "${pkgs[@]}" semantic-release

      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
