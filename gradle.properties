# Conservative memory/parallelism so builds also run on older 8 GB machines; raise them in
# ~/.gradle/gradle.properties if you have more.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx1g

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Device CPU architectures to build. Default covers every Android TV / Google TV:
# armeabi-v7a (32-bit, e.g. Chromecast with Google TV) and arm64-v8a (64-bit, e.g. Google TV Streamer).
# To build only what your TV reports (`adb shell getprop ro.product.cpu.abilist`) — faster —
# override it in ~/.gradle/gradle.properties, e.g.:  airplayrx.abis=armeabi-v7a
# scripts/build-openssl.sh reads the same setting (env AIRPLAYRX_ABIS wins over both files).
airplayrx.abis=armeabi-v7a,arm64-v8a
